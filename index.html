<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ATGS | NHL 2026–27</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --rink:#13233d; --rink-2:#1b3150; --ice:#eef3f8; --card:#ffffff; --line:#d9e1ea; --line-2:#edf1f6;
  --ink:#0f1b2d; --mute:#5b6b80; --faint:#8a98ab;
  --win:#15803d; --win-bg:#eaf6ee; --loss:#c62828; --loss-bg:#fdecec;
  --odds:#b45309; --accent:#1d6fd8; --accent-bg:#e8f1fc;
  --num:'Barlow Condensed',system-ui,sans-serif; --txt:'Barlow',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--txt);background:var(--ice);color:var(--ink);display:flex;flex-direction:column;font-size:15px;
  padding-top:env(safe-area-inset-top,0px)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--loss)} .zero{color:var(--faint)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Top bar ── */
.topbar{flex-shrink:0;background:var(--rink);color:#fff;display:flex;align-items:center;gap:24px;padding:14px 28px}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand b{font-family:var(--num);font-weight:700;font-size:1.9rem;letter-spacing:.5px}
.brand span{color:rgba(255,255,255,.55);font-size:.85rem}
.chips{display:flex;gap:28px}
.chip{display:flex;flex-direction:column;align-items:flex-end}
.chip small{font-size:.72rem;color:rgba(255,255,255,.55)}
.chip strong{font-family:var(--num);font-weight:600;font-size:1.6rem;line-height:1.1}
.chip .pos{color:#5ee08a} .chip .neg{color:#ff8a8a} .chip .zero{color:rgba(255,255,255,.6)}
.date-pill{font-size:.82rem;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;white-space:nowrap}

/* ── Tabs + ticker ── */
.tabs{flex-shrink:0;background:var(--rink);display:flex;gap:4px;padding:0 20px;border-top:1px solid rgba(255,255,255,.08)}
.tab{background:none;border:0;cursor:pointer;color:rgba(255,255,255,.55);font-weight:600;padding:10px 14px;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#7fb5ff}
.ticker{flex-shrink:0;height:28px;overflow:hidden;background:var(--rink-2);display:flex;align-items:center}
.ticker-track{display:inline-flex;gap:40px;white-space:nowrap;padding-left:100%;animation:scroll 70s linear infinite;font-size:.78rem;color:rgba(255,255,255,.55)}
.ticker-track em{font-style:normal;color:#fff;font-weight:600}
@keyframes scroll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;padding-left:20px}}

/* ── Pages ── */
main{flex:1;min-height:0;display:flex;flex-direction:column}
.page{display:none;flex:1;min-height:0}
.page.on{display:flex}

/* ── Daily ── */
.daily{flex:1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,.9fr);gap:1px;background:var(--line);min-height:0}
.pane{background:var(--card);display:flex;flex-direction:column;min-height:0}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pane-head h2{font-family:var(--num);font-weight:700;font-size:1.35rem;letter-spacing:.2px}
.count{font-size:.8rem;color:var(--mute);background:var(--ice);border-radius:999px;padding:3px 10px}
.count:empty{display:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.subtabs{display:none}

.pane{container-type:inline-size}
.slate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);background:#f7f9fc}
.slate div{padding:10px 18px;border-right:1px solid var(--line-2);min-width:0}
.slate div:last-child{border-right:0}
.slate strong{display:block;font-family:var(--num);font-weight:700;font-size:1.45rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slate small{font-size:.72rem;color:var(--mute);white-space:nowrap}
.slate .sub{font-family:var(--txt);font-size:.72rem;font-weight:500;color:var(--mute);margin-left:4px}

.prow{display:grid;grid-template-columns:minmax(0,1fr) 96px 64px 52px 112px;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line-2)}
.phead{font-size:.72rem;color:var(--mute);padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.phead .r,.prow .r{text-align:right}
.prow.top{box-shadow:inset 3px 0 0 var(--win)}
.player{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:.76rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pmeta .mbook{display:none}
.book{font-size:.8rem;color:var(--accent);background:var(--accent-bg);border-radius:6px;padding:2px 8px;white-space:nowrap}
.odds{font-family:var(--num);font-weight:600;font-size:1.15rem;color:var(--odds)}
.fv{font-family:var(--num);color:var(--faint);font-size:1rem}
.evc{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.ev{font-family:var(--num);font-weight:700;color:var(--win);font-size:1.1rem;min-width:40px;text-align:right}
.evbar{width:52px;height:6px;border-radius:3px;background:var(--win-bg);overflow:hidden;flex-shrink:0}
.evbar i{display:block;height:100%;background:var(--win);border-radius:3px}
.prow.cashed>*{opacity:.45} .prow.cashed .player{text-decoration:line-through}
.tag{font-size:.7rem;font-weight:500;color:var(--mute);background:var(--ice);border-radius:4px;padding:1px 6px;margin-left:6px}

@container (max-width:560px){
  .prow{grid-template-columns:minmax(0,1fr) 60px 92px;gap:10px;padding:10px 14px}
  .c-book,.c-fv{display:none}
  .pmeta .mbook{display:inline}
  .evbar{width:36px}
  .slate div{padding:9px 12px}
  .slate strong{font-size:1.2rem}
  .slate .sub{display:none}
}

.res-sum{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 18px;border-bottom:1px solid var(--line);gap:8px;background:#f7f9fc}
.res-sum div strong{display:block;font-family:var(--num);font-size:1.5rem;font-weight:700;line-height:1}
.res-sum div small{font-size:.72rem;color:var(--mute)}
.res-grid{display:grid;grid-template-columns:1fr}
@container (min-width:600px){ .res-grid{grid-template-columns:1fr 1fr} .res-grid .res:nth-child(odd){border-right:1px solid var(--line-2)} }
.res{display:grid;grid-template-columns:4px minmax(0,1fr) auto auto;align-items:center;border-bottom:1px solid var(--line-2)}
.res i{align-self:stretch;background:var(--faint)} .res.W i{background:var(--win)} .res.L i{background:var(--loss)}
.res .who{padding:9px 12px;min-width:0} .res .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .who small{display:block;font-size:.75rem;color:var(--mute)}
.res .o{padding:0 8px} .res .p{font-family:var(--num);font-weight:700;font-size:1.1rem;padding:0 14px 0 4px;min-width:64px;text-align:right}
.res.V .who b{text-decoration:line-through;opacity:.5}

.parlay{margin:12px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.parlay header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--ice)}
.parlay header .odds{font-size:1.2rem}
.parlay header small{font-size:.75rem;color:var(--mute)}
.parlay .legs{counter-reset:leg}
.leg::before{counter-increment:leg;content:counter(leg);font-family:var(--num);color:var(--faint);width:14px;flex-shrink:0}
.leg{padding:8px 12px;border-top:1px solid var(--line-2);display:flex;align-items:baseline;gap:10px}
.leg b{flex:1;min-width:0}
.leg small{color:var(--mute);font-size:.78rem}

.empty{padding:48px 24px;text-align:center;color:var(--mute);font-size:.9rem;line-height:1.5}
.empty strong{display:block;color:var(--ink);font-family:var(--num);font-size:1.2rem;font-weight:600;margin-bottom:4px}

/* ── Summary ── */
.summary{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 40px}
.seg{display:inline-flex;background:#dde6f0;border-radius:10px;padding:3px;margin-bottom:18px}
.seg button{border:0;background:none;cursor:pointer;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--mute)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,27,45,.12)}

.hero{background:var(--rink);color:#fff;border-radius:16px;padding:24px 28px 8px;margin-bottom:16px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero h1{font-family:var(--num);font-weight:600;font-size:1.05rem;color:rgba(255,255,255,.7)}
.hero .span{font-size:.82rem;color:rgba(255,255,255,.45);margin-top:2px}
.big{font-family:var(--num);font-weight:700;font-size:4.6rem;line-height:.95;margin-top:10px;font-variant-numeric:tabular-nums}
.big.pos{color:#5ee08a} .big.neg{color:#ff8a8a} .big.zero{color:#fff}
.big-lbl{font-size:.82rem;color:rgba(255,255,255,.55)}
.hstats{display:grid;grid-template-columns:repeat(3,auto);gap:12px 36px}
.hstats div small{display:block;font-size:.74rem;color:rgba(255,255,255,.5)}
.hstats div strong{font-family:var(--num);font-weight:600;font-size:1.45rem;white-space:nowrap}
.chart{margin-top:16px;position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart-cap{font-size:.74rem;color:rgba(255,255,255,.45);margin:14px 0 -6px}
.chart .none{height:150px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);font-size:.9rem;border-top:1px dashed rgba(255,255,255,.18)}

.grid{display:grid;gap:12px}
.g6{grid-template-columns:repeat(6,1fr)} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.tile{padding:14px 16px}
.tile small{font-size:.76rem;color:var(--mute)}
.tile strong{display:block;font-family:var(--num);font-weight:700;font-size:1.6rem;line-height:1.1;margin-top:2px}
.tile span{font-size:.78rem;color:var(--faint)}
h3.sec{font-family:var(--num);font-weight:700;font-size:1.3rem;margin:26px 0 10px}

table.t{width:100%;border-collapse:collapse}
table.t th{font-size:.74rem;font-weight:500;color:var(--mute);text-align:right;padding:10px 16px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:10px 16px;border-bottom:1px solid var(--line-2);text-align:right;font-family:var(--num);font-size:1.05rem}
table.t td:first-child{font-family:var(--txt);font-size:.95rem;font-weight:600}
table.t tr:last-child td{border-bottom:0}
table.t td.meta{font-family:var(--txt);font-size:.85rem;color:var(--mute);font-weight:400}
.bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:8px}

.month header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
.month header b{font-family:var(--num);font-weight:700;font-size:1.15rem}
.month header strong{font-family:var(--num);font-weight:700;font-size:1.3rem}
.month .rec{font-size:.78rem;color:var(--mute);padding:8px 16px 2px}
.month .row{display:flex;justify-content:space-between;padding:4px 16px;font-size:.9rem}
.month .row span:last-child{font-family:var(--num);font-weight:600;font-size:1rem}
.month footer{display:flex;justify-content:space-between;padding:8px 16px;margin-top:6px;border-top:1px solid var(--line);font-size:.82rem;color:var(--mute)}
.month footer b{font-family:var(--num);font-size:1rem}

.lb header{padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--num);font-weight:700;font-size:1.15rem}
.lb .row{display:grid;grid-template-columns:22px 1fr auto 72px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.lb .row:last-child{border-bottom:0}
.lb .rk{font-family:var(--num);color:var(--faint)} .lb .rec{font-size:.8rem;color:var(--mute)}
.lb .pl{font-family:var(--num);font-weight:700;font-size:1.1rem;text-align:right}

.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{padding:16px 18px;border-left:4px solid var(--accent)}
.note.w{border-left-color:var(--win)} .note.l{border-left-color:var(--loss)} .note.o{border-left-color:var(--odds)}
.note b{display:block;font-size:1rem;margin-bottom:4px}
.note p{font-size:.88rem;color:var(--mute);line-height:1.5}
.hint{color:var(--mute);font-size:.9rem;line-height:1.5;padding:18px}

.foot{flex-shrink:0;text-align:center;padding:8px 16px;font-size:.7rem;color:var(--faint);border-top:1px solid var(--line);background:var(--card)}
.bottom-nav{display:none}

/* ── Responsive ── */
@media (max-width:1100px){ .g6{grid-template-columns:repeat(3,1fr)} .g3{grid-template-columns:1fr 1fr} }
@media (min-width:641px) and (max-width:1100px){
  .daily{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1.15fr) minmax(0,1fr)}
  #paneToday{grid-row:1 / span 2}
  .topbar{padding:12px 20px;gap:18px}
  .brand span{display:none}
}
@media (min-width:641px) and (max-width:820px){
  .chips{gap:18px} .chip strong{font-size:1.35rem}
  .date-pill{display:none}
}
@media (max-width:640px){
  body{font-size:14px}
  .topbar{padding:10px 14px;gap:12px}
  .brand span,.date-pill,.tabs{display:none}
  .chips{gap:16px} .chip strong{font-size:1.2rem} .chip small{font-size:.65rem}
  .subtabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  .subtabs button{flex:1;border:0;background:none;padding:11px 6px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}
  .subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  #page-daily{flex-direction:column}
  .daily{grid-template-columns:1fr}
  .daily .pane.hide{display:none}
    .wrap{padding:14px 12px 28px}
  .hero{padding:18px 18px 6px}
  .big{font-size:3.4rem}
  .hstats{grid-template-columns:repeat(3,1fr);gap:10px 14px}
  .hstats div strong{font-size:1.2rem}
  .g6{grid-template-columns:1fr 1fr} .g2,.g3,.notes{grid-template-columns:1fr}
  table.t th,table.t td{padding:9px 10px}
  .hide-sm{display:none}
  .bottom-nav{display:flex;flex-shrink:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottom-nav button{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;font-size:.8rem;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
  .bottom-nav button[aria-selected="true"]{color:var(--ink)}
  .foot{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>ATGS</b><span id="brandSub"></span></div>
  <div class="chips">
    <div class="chip"><small>Season net</small><strong id="chipNet"></strong></div>
    <div class="chip"><small>Record</small><strong id="chipRec"></strong></div>
    <div class="chip"><small id="chipLastLbl">Last day</small><strong id="chipLast"></strong></div>
  </div>
  <div class="date-pill" id="datePill"></div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-page="daily">Daily plays</button>
  <button class="tab" role="tab" aria-selected="false" data-page="summary">Season summary</button>
</nav>
<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

<main>
  <section class="page on" id="page-daily">
    <div class="subtabs" role="tablist">
      <button role="tab" aria-selected="true" data-pane="paneToday" id="subToday">Today</button>
      <button role="tab" aria-selected="false" data-pane="paneYest" id="subYest">Results</button>
      <button role="tab" aria-selected="false" data-pane="paneParlays" id="subParlays">Parlays</button>
    </div>
    <div class="daily">
      <div class="pane" id="paneToday">
        <div class="pane-head"><h2>Today's plays</h2><span class="count" id="todayCount"></span></div>
        <div class="slate" id="slate"></div>
        <div class="scroll">
          <div class="prow phead"><span>Player</span><span class="c-book">Book</span><span class="r">Odds</span><span class="r c-fv">FV</span><span class="r">EV</span></div>
          <div id="todayBody"></div>
        </div>
      </div>
      <div class="pane hide" id="paneYest">
        <div class="pane-head"><h2 id="yestTitle">Last results</h2><span class="count" id="yestCount"></span></div>
        <div class="res-sum" id="yestSum"></div>
        <div class="scroll" id="yestList"></div>
      </div>
      <div class="pane hide" id="paneParlays">
        <div class="pane-head"><h2>Parlays</h2><span class="count" id="parlayCount"></span></div>
        <div class="scroll" id="parlayList"></div>
      </div>
    </div>
  </section>

  <section class="page" id="page-summary">
    <div class="summary"><div class="wrap">
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="true" data-view="current" id="segCurrent"></button>
        <button role="tab" aria-selected="false" data-view="archive">2025–26 archive</button>
      </div>
      <div id="view-current"></div>
      <div id="view-archive" hidden></div>
    </div></div>
  </section>
</main>

<nav class="bottom-nav" role="tablist">
  <button role="tab" aria-selected="true" data-page="daily">Daily</button>
  <button role="tab" aria-selected="false" data-page="summary">Summary</button>
</nav>

<div class="foot">For entertainment purposes only. Not affiliated with the NHL or any sportsbook. Past results do not guarantee future performance. Gamble responsibly: 1-800-GAMBLER.</div>

<script>
/* ════════════════════════════════════════════════════════════════
   DAILY UPDATE AREA: the only section that needs editing each day
   ════════════════════════════════════════════════════════════════ */

const SEASON = { label:'2026–27', start:'2026-09-30' };

// Today's slate. Optional: game:'EDM @ VGK', time:'7:00 PM', u:1 (units, default 1).
// status:'cashed' shows the play struck through and drops it from the count.
const TODAY = {
  date: '2026-09-30',
  plays: [
    // { player:'Player Name', book:'Bet365', odds:310, fv:281, ev:7.7, game:'MIN @ DAL', time:'8:00 PM' },
  ],
};

// Parlays for today.
const PARLAYS = [
  // { odds:650, boost:'25% boost', matchup:'EDM @ VGK', legs:[{ player:'Name', prop:'Anytime goal' }] },
];

// Every settled bet this season. Append yesterday's plays here after the games.
// r: 'W' win, 'L' loss, 'V' void. P/L is calculated from odds and units (u defaults to 1).
// Add pl:<number> only to override (boosted odds, cash outs).
const LOG = [
  // { d:'2026-10-01', p:'Player Name', b:'Bet365', o:250, fv:230, ev:3.2, g:'MIN @ DAL', r:'W' },
];

// Free bet adjustments (negative numbers), dated to the month they belong in.
const FREE_BETS = [
  // { d:'2026-10-01', u:-1 },
];

/* ════════════════════ END DAILY UPDATE AREA ════════════════════ */

// ── ENGINE: turns the bet log into every number on the page ──
const BOOK_ORDER = ['Bet365','FanDuel','MGM','DraftKings','Fanatics','BetRivers'];
const BOOK_ALIAS = { DK:'DraftKings', FD:'FanDuel', FN:'Fanatics', Kambi:'BetRivers', Robinhood:'BetRivers', 'BetRivers/Kambi':'BetRivers' };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const r2 = v => Math.round(v * 100) / 100;

function betPL(x) {
  if (typeof x.pl === 'number') return x.pl;
  const u = x.u ?? 1;
  if (x.r === 'W') return r2(x.o > 0 ? u * x.o / 100 : u * 100 / -x.o);
  if (x.r === 'L') return -u;
  return 0;
}

function buildModel(log, freeBets = []) {
  const bets = log.filter(x => x.r).map(x => ({ ...x, b: BOOK_ALIAS[x.b] || x.b, u: x.u ?? 1, pl: betPL(x) }))
                  .sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  const blank = () => ({ n:0, w:0, l:0, v:0, pl:0, risked:0 });
  const add = (s, x) => { s.n++; s.pl += x.pl; if (x.r === 'V') s.v++; else { s.risked += x.u; if (x.pl > 0) s.w++; else if (x.pl < 0) s.l++; } };
  const tot = blank(), books = {}, months = {}, players = {}, days = {};
  bets.forEach(x => {
    add(tot, x);
    add(books[x.b] ||= blank(), x);
    const mk = x.d.slice(0, 7);
    const m = months[mk] ||= { ...blank(), books:{}, fb:0 };
    add(m, x); m.books[x.b] = (m.books[x.b] || 0) + x.pl;
    add(players[x.p] ||= blank(), x);
    days[x.d] = (days[x.d] || 0) + x.pl;
  });
  let fbTotal = 0;
  freeBets.forEach(f => { const mk = f.d.slice(0, 7); (months[mk] ||= { ...blank(), books:{}, fb:0 }).fb += f.u; fbTotal += f.u; });

  // daily series, streaks, drawdown
  const dayList = Object.keys(days).sort().map(d => ({ d, pl: r2(days[d]) }));
  let cum = 0, peak = 0, peakD = null, dd = { amt:0, from:null, to:null };
  const series = dayList.map(x => {
    cum = r2(cum + x.pl);
    if (cum > peak) { peak = cum; peakD = x.d; }
    if (cum - peak < dd.amt) dd = { amt: r2(cum - peak), from: peakD, to: x.d };
    return [x.d, cum];
  });
  let ws = 0, ls = 0, cw = 0, cl = 0;
  bets.filter(x => x.r !== 'V').forEach(x => {
    if (x.pl > 0) { cw++; cl = 0; } else { cl++; cw = 0; }
    ws = Math.max(ws, cw); ls = Math.max(ls, cl);
  });
  const sortedDays = [...dayList].sort((a, b) => b.pl - a.pl);
  const mList = Object.keys(months).sort().map(k => {
    const m = months[k], [y, mo] = k.split('-');
    const bk = {}; Object.entries(m.books).forEach(([n, v]) => bk[n] = r2(v));
    return { key:k, label: MONTHS[+mo - 1] + ' ' + y, n:m.n, w:m.w, l:m.l, v:m.v, risked:r2(m.risked), gross:r2(m.pl), fb:r2(m.fb), net:r2(m.pl + m.fb), books:bk };
  });
  const pList = Object.entries(players).map(([name, s]) => ({ name, n:s.n, w:s.w, l:s.l, v:s.v, pl:r2(s.pl) }));
  const byPL = [...pList].sort((a, b) => b.pl - a.pl || b.n - a.n);
  return {
    n: tot.n, w: tot.w, l: tot.l, v: tot.v, risked: r2(tot.risked),
    gross: r2(tot.pl), fb: r2(fbTotal), net: r2(tot.pl + fbTotal),
    series, dayCount: dayList.length,
    upDays: dayList.filter(x => x.pl > 0).length, downDays: dayList.filter(x => x.pl < 0).length,
    bestDay: sortedDays[0] || null, worstDay: sortedDays[sortedDays.length - 1] || null,
    winStreak: ws, lossStreak: ls, drawdown: dd,
    months: mList,
    books: BOOK_ORDER.concat(Object.keys(books).filter(b => !BOOK_ORDER.includes(b)))
      .filter(b => books[b]).map(b => ({ name:b, n:books[b].n, w:books[b].w, l:books[b].l, v:books[b].v, pl:r2(books[b].pl), risked:r2(books[b].risked) })),
    top: byPL.filter(p => p.pl > 0).slice(0, 5),
    bottom: byPL.filter(p => p.pl < 0).reverse().slice(0, 5),
    topWins: [...bets].sort((a, b) => b.pl - a.pl).slice(0, 5).map(x => ({ p:x.p, b:x.b, d:x.d, o:x.o, pl:r2(x.pl) })),
    last: bets.length ? bets[bets.length - 1].d : null,
    bets,
  };
}

const $ = id => document.getElementById(id);

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const shortDate = s => { const d = toDate(s); return MON[d.getMonth()] + ' ' + d.getDate(); };
const longDate  = s => { const d = toDate(s); return DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); };
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
const sign = v => v > 0 ? '+' : v < 0 ? '−' : '';
const u = (v, suf = 'u') => sign(v) + Math.abs(v).toFixed(2) + suf;
const odds = o => o == null ? '–' : (o > 0 ? '+' + o : '−' + Math.abs(o));
const pct = (a, b) => b ? sign(a) + Math.abs(a / b * 100).toFixed(1) + '%' : '–';
const rate = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '–';

/* ── season view (shared by current season and archive) ── */
function chartSVG(series, startDate) {
  if (!series.length) return '';
  const pts = [[startDate, 0], ...series];
  const W = 1000, H = 230, pl = 44, pr = 16, pt = 14, pb = 26;
  const t0 = toDate(pts[0][0]).getTime(), t1 = toDate(pts[pts.length - 1][0]).getTime() || t0 + 1;
  const vals = pts.map(p => p[1]), lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  const x = d => pl + (toDate(d).getTime() - t0) / Math.max(1, t1 - t0) * (W - pl - pr);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join('');
  const area = line + `L${x(pts[pts.length - 1][0]).toFixed(1)},${y(lo)}L${x(pts[0][0]).toFixed(1)},${y(lo)}Z`;
  const step = hi - lo > 60 ? 25 : hi - lo > 20 ? 10 : 5;
  let grid = '';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    grid += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v === 0 ? .35 : .08})"/>
             <text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" fill="rgba(255,255,255,.45)" font-size="12" font-family="Barlow Condensed">${v}</text>`;
  let months = '', seen = new Set();
  pts.forEach(p => { const k = p[0].slice(0, 7); if (!seen.has(k)) { seen.add(k); const d = toDate(k + '-01'); const xx = Math.max(pl, x(k + '-01'));
    months += `<text x="${xx}" y="${H - 6}" fill="rgba(255,255,255,.45)" font-size="12" font-family="Barlow">${MON[d.getMonth()]}</text>`; } });
  const end = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative units by date">
    <defs><linearGradient id="fill${startDate}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5ee08a" stop-opacity=".28"/><stop offset="1" stop-color="#5ee08a" stop-opacity="0"/></linearGradient></defs>
    ${grid}${months}
    <path d="${area}" fill="url(#fill${startDate})"/>
    <path d="${line}" fill="none" stroke="#5ee08a" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(end[0])}" cy="${y(end[1])}" r="4.5" fill="#5ee08a"/>
  </svg>`;
}

function renderSeason(el, m, o) {
  const decided = m.w + m.l;
  let h = `
  <div class="hero">
    <div class="hero-top">
      <div>
        <h1>${o.title}</h1><div class="span">${o.span}</div>
        <div class="big ${cls(m.net)}">${u(m.net)}</div><div class="big-lbl">Net units${m.fb ? ' after ' + u(m.fb) + ' in free bets' : ''}</div>
      </div>
      <div class="hstats">
        <div><small>Record</small><strong>${m.n ? rec(m) : '0–0'}</strong></div>
        <div><small>Win rate</small><strong>${rate(m.w, decided)}</strong></div>
        <div><small>ROI, net</small><strong>${pct(m.net, m.risked)}</strong></div>
        <div><small>Bets</small><strong>${m.n}</strong></div>
        <div><small>Gross</small><strong>${u(m.gross)}</strong></div>
        <div><small>ROI, gross</small><strong>${pct(m.gross, m.risked)}</strong></div>
      </div>
    </div>
    <div class="chart-cap">Cumulative units, before free bets</div><div class="chart">${m.series.length ? chartSVG(m.series, o.start) : `<div class="none">The curve starts with the first settled bet.</div>`}</div>
  </div>`;

  if (!m.n) {
    el.innerHTML = h + `<div class="card hint">Books, months, highlights and the player leaderboard fill in automatically as results are added to the log.</div>`;
    return;
  }

  const bestMonth = [...m.months].sort((a, b) => b.net - a.net)[0];
  const tiles = [
    ['Best day', u(m.bestDay.pl), shortDate(m.bestDay.d), 'pos'],
    ['Worst day', u(m.worstDay.pl), shortDate(m.worstDay.d), 'neg'],
    ['Best month', u(bestMonth.net), bestMonth.label, 'pos'],
    ['Longest win streak', m.winStreak + ' straight', 'Consecutive winning bets', ''],
    ['Longest skid', m.lossStreak + ' straight', 'Consecutive losing bets', ''],
    ['Max drawdown', u(m.drawdown.amt), m.drawdown.from ? shortDate(m.drawdown.from) + ' to ' + shortDate(m.drawdown.to) : '–', 'neg'],
  ];
  h += `<h3 class="sec">Highlights</h3><div class="grid g6">` +
    tiles.map(t => `<div class="card tile"><small>${t[0]}</small><strong class="${t[3]}">${t[1]}</strong><span>${t[2]}</span></div>`).join('') + `</div>`;

  if (o.notes) h += `<h3 class="sec">Takeaways</h3><div class="notes">` +
    o.notes.map(n => `<div class="card note ${n.c}"><b>${n.t}</b><p>${n.p}</p></div>`).join('') + `</div>`;

  const maxAbs = Math.max(...m.books.map(b => Math.abs(b.pl)), 1);
  h += `<h3 class="sec">By book</h3><div class="card"><table class="t">
    <thead><tr><th>Book</th><th>Bets</th><th>Record</th><th class="hide-sm">Win rate</th><th class="hide-sm">ROI</th><th>P/L</th></tr></thead><tbody>` +
    m.books.map(b => `<tr><td>${b.name}</td><td>${b.n}</td><td>${rec(b)}</td><td class="hide-sm">${rate(b.w, b.w + b.l)}</td><td class="hide-sm ${cls(b.pl)}">${pct(b.pl, b.risked)}</td>
      <td class="${cls(b.pl)}"><span class="bar hide-sm" style="width:${Math.round(Math.abs(b.pl) / maxAbs * 70)}px;background:currentColor;opacity:.35"></span>${u(b.pl, '')}</td></tr>`).join('') +
    `</tbody></table></div>`;

  h += `<h3 class="sec">By month</h3><div class="grid g3">` + m.months.map(mo => {
    const books = Object.entries(mo.books).sort((a, b) => b[1] - a[1]);
    return `<div class="card month">
      <header><b>${mo.label}</b><strong class="${cls(mo.net)}">${u(mo.net)}</strong></header>
      <div class="rec">${mo.n} bets, ${rec(mo)}</div>
      ${books.map(([n, v]) => `<div class="row"><span>${n}</span><span class="${cls(v)}">${u(v, '')}</span></div>`).join('')}
      <footer><span>Gross <b class="${cls(mo.gross)}">${u(mo.gross)}</b></span>${mo.fb ? `<span>Free bets <b class="neg">${u(mo.fb)}</b></span>` : ''}</footer>
    </div>`; }).join('') + `</div>`;

  const lb = (title, list) => `<div class="card lb"><header>${title}</header>` + (list.length ? list.map((p, i) => `
      <div class="row"><span class="rk">${i + 1}</span><b>${p.name}</b><span class="rec">${rec(p)}</span><span class="pl ${cls(p.pl)}">${u(p.pl)}</span></div>`).join('') : `<div class="hint">No players yet.</div>`) + `</div>`;
  h += `<h3 class="sec">Player leaderboard</h3><div class="grid g2">${lb('Top 5', m.top)}${lb('Bottom 5', m.bottom)}</div>`;

  h += `<h3 class="sec">Biggest single wins</h3><div class="card"><table class="t">
    <thead><tr><th>Player</th><th>Book</th><th class="hide-sm">Date</th><th>Odds</th><th>Units</th></tr></thead><tbody>` +
    m.topWins.filter(x => x.pl > 0).map(x => `<tr><td>${x.p}</td><td class="meta">${x.b}</td><td class="meta hide-sm">${shortDate(x.d)}</td><td class="odds">${odds(x.o)}</td><td class="pos">${u(x.pl)}</td></tr>`).join('') +
    `</tbody></table></div>`;

  el.innerHTML = h;
}

/* ── navigation ── */
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'page-' + page));
  document.querySelectorAll('[data-page]').forEach(b => b.setAttribute('aria-selected', b.dataset.page === page));
}
function showPane(id) {
  document.querySelectorAll('.subtabs [data-pane]').forEach(b => b.setAttribute('aria-selected', b.dataset.pane === id));
  document.querySelectorAll('.daily .pane').forEach(p => p.classList.toggle('hide', p.id !== id));
}
document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => showPage(b.dataset.page));
document.querySelectorAll('[data-pane]').forEach(b => b.onclick = () => showPane(b.dataset.pane));
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-selected', x === b));
  $('view-current').hidden = b.dataset.view !== 'current';
  $('view-archive').hidden = b.dataset.view !== 'archive';
});
// Panes are only hidden on phones; on wider screens all three show.
const mq = matchMedia('(max-width:640px)');
const syncPanes = () => { if (!mq.matches) document.querySelectorAll('.daily .pane').forEach(p => p.classList.remove('hide'));
  else showPane(document.querySelector('.subtabs [aria-selected="true"]').dataset.pane); };
mq.addEventListener ? mq.addEventListener('change', syncPanes) : mq.addListener(syncPanes);

/* ── init ── */
renderTop(); renderToday(); renderYest(); renderParlays(); syncPanes();
renderSeason($('view-current'), CUR, { title: 'NHL ' + SEASON.label + ' season', span: 'Opens ' + longDate(SEASON.start), start: SEASON.start });
renderSeason($('view-archive'), ARCHIVE, { title: '2025–26 regular season', span: 'Oct 16, 2025 to Apr 13, 2026, 104 betting days', start: '2025-10-15', notes: ARCHIVE_NOTES });
</script>
</body>
</html>
